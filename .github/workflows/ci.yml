
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libgtest-dev \
            nlohmann-json3-dev \
            libboost-all-dev \
            libcurl4-openssl-dev

      - name: Create dummy config.h
        run: |
          echo '#pragma once' > client/config.h
          echo 'constexpr const char* API_KEY = "dummy_key_for_ci";' >> client/config.h

      - name: Configure CMake (shared + tests only)
        run: cmake -B build -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF

      - name: Build
        run: cmake --build build --target all_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -E "TaskValidator.CorrectAnswerPasses|TaskValidator.TrailingWhitespaceIgnored"